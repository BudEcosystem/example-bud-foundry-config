# Illustrative self-signed output from templates/appset.yaml.tmpl.
# budctl replaces the repository, domain, values, and SOPS secret files.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: example
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: argocd
            namespace: argocd
            repoURL: registry.bud.studio/charts
            chart: argocd
            targetRevision: "0.1.1"
            valueFiles:
              - "$values/values/argocd/secrets.example.yaml"
              - "$values/values/argocd/values.budruntime.yaml"
              - "$values/values/argocd/values.example.yaml"
          - name: dapr
            namespace: dapr-system
            repoURL: https://dapr.github.io/helm-charts
            chart: dapr
            targetRevision: "1.18.4"
            valueFiles:
              - "$values/values/dapr/values.yaml"
          - name: kafka
            namespace: kafka
            repoURL: registry.bud.studio/charts
            chart: kafka
            targetRevision: "0.1.1"
            valueFiles:
              - "example.minimal.yaml"
              - "$values/values/kafka/values.budruntime.yaml"
              - "$values/values/kafka/secrets.example.yaml"
          - name: mongodb
            namespace: mongodb
            repoURL: registry.bud.studio/charts
            chart: mongodb
            targetRevision: "0.1.1"
            valueFiles:
              - "example.minimal.yaml"
              - "$values/values/mongodb/values.budruntime.yaml"
              - "$values/values/mongodb/secrets.example.yaml"
          - name: cert-manager
            namespace: cert-manager
            repoURL: registry.bud.studio/charts
            chart: cert-manager
            targetRevision: "0.1.3"
            valueFiles:
              - "$values/values/cert-manager/values.budruntime.yaml"
              - "$values/values/cert-manager/values.selfsigned-ca.yaml"
          - name: kyverno
            namespace: kyverno
            repoURL: registry.bud.studio/charts
            chart: kyverno
            targetRevision: "0.0.2"
            valueFiles:
              - "$values/values/kyverno/values.inject-ca.yaml"
              - "$values/values/kyverno/values.budruntime.yaml"
          - name: clickhouse
            namespace: clickhouse
            repoURL: registry.bud.studio/charts
            chart: clickhouse
            targetRevision: "0.1.1"
            valueFiles:
              - "example.minimal.yaml"
              - "$values/values/clickhouse/values.budruntime.yaml"
              - "$values/values/clickhouse/secrets.example.yaml"
          - name: postgres
            namespace: postgres
            repoURL: registry.bud.studio/charts
            chart: postgres
            targetRevision: "0.1.1"
            valueFiles:
              - "example.minimal.yaml"
              - "$values/values/postgres/values.budruntime.yaml"
              - "$values/values/postgres/values.minimal.budruntime.yaml"
              - "$values/values/postgres/secrets.example.yaml"
          - name: seaweedfs
            namespace: seaweedfs
            repoURL: registry.bud.studio/charts
            chart: seaweedfs
            targetRevision: "0.1.2"
            valueFiles:
              - "example.minimal.yaml"
              - "$values/values/seaweedfs/values.budruntime.yaml"
              - "$values/values/seaweedfs/values.example.yaml"
              - "$values/values/seaweedfs/secrets.example.yaml"
          - name: valkey
            namespace: valkey
            repoURL: registry-1.docker.io/cloudpirates
            chart: valkey
            targetRevision: "0.21.4"
            valueFiles:
              - "$values/values/valkey/values.yaml"
              - "$values/values/valkey/values.minimal.yaml"
              - "$values/values/valkey/values.budruntime.yaml"
              - "$values/values/valkey/secrets.example.yaml"
          - name: keycloak
            namespace: keycloak
            repoURL: registry.bud.studio/charts
            chart: keycloak
            targetRevision: "0.2.1"
            valueFiles:
              - "$values/values/keycloak/values.budruntime.yaml"
              - "$values/values/keycloak/values.example.yaml"
              - "$values/values/keycloak/secrets.example.yaml"
          - name: bud
            namespace: bud
            repoURL: registry.bud.studio/charts
            chart: bud
            targetRevision: "1.3.0"
            valueFiles:
              - "$values/values/bud/values.example.yaml"
              - "$values/values/bud/secrets.example.yaml"
          - name: opensandbox
            namespace: opensandbox-system
            repoURL: registry.bud.studio/charts
            chart: opensandbox
            targetRevision: "0.0.1"
            valueFiles:
              - "$values/values/opensandbox/secrets.example.yaml"
  template:
    metadata:
      name: "example-{{.name}}"
    spec:
      project: example
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.namespace}}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        automated:
          enabled: false
          selfHeal: true
  templatePatch: |
    spec:
      sources:
        - repoURL: {{ .repoURL | quote }}
          chart: {{ .chart | quote }}
          targetRevision: {{ .targetRevision | quote }}
          helm:
            releaseName: "{{.name}}"
            valueFiles:
              {{- .valueFiles | toYaml | nindent 12 }}
        - repoURL: "https://github.com/example-org/bud-foundry-config.git"
          targetRevision: "main"
          ref: values
