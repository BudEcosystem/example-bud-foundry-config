# Illustrative public ArgoCD overlay generated by budctl.
argo-cd:
  configs:
    cm:
      url: https://argocd.bud.example.com
global:
  domain: argocd.bud.example.com
ingress:
  className: nginx
  enabled: true
  host: argocd.bud.example.com
  isTraefik: false
projects:
  example:
    clusterResourceWhitelist:
      - group: "*"
        kind: "*"
    destinations:
      - namespace: "*"
        server: https://kubernetes.default.svc
    sourceRepos:
      - "*"
repo:
  enabled: true
  url: https://github.com/example-org/bud-foundry-config
