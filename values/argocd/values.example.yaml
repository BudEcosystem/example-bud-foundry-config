global:
  domain: argocd.bud.example.com

ingress:
  enabled: true
  host: argocd.bud.example.com
  className: traefik
  isTraefik: true

argo-cd:
  configs:
    cm:
      url: https://argocd.bud.example.com

repo:
  enabled: true
  url: "https://github.com/example-org/bud-foundry-config.git"

projects:
  bud:
    clusterResourceWhitelist:
      - group: "*"
        kind: "*"
    destinations:
      - namespace: "*"
        server: "https://kubernetes.default.svc"
    sourceRepos:
      - "*"
