# Illustrative public overlay generated by budctl for bud.example.com.
# The paired secrets.example.yaml is intentionally absent; budctl creates it
# with environment-specific credentials and encrypts it using SOPS.
externalServices:
  oidc:
    url: https://auth.bud.example.com/realms/bud-keycloak
  s3:
    endpoint: s3.bud.example.com
    secure: true
global:
  ingress:
    hosts:
      root: bud.example.com
ingress:
  className: traefik
  https: internal
  isTraefik: true
microservices:
  budapp:
    redirectFlow:
      clientsByHost:
        budadmin:
          hosts:
            - '{{ include "bud.ingress.hosts.budadmin" . }}'
          allowedReturnUrlOrigins:
            - '{{ include "bud.ingress.url.budadmin" . }}'
        budcustomer:
          hosts:
            - '{{ include "bud.ingress.hosts.budcustomer" . }}'
          allowedReturnUrlOrigins:
            - '{{ include "bud.ingress.url.budcustomer" . }}'
        budplayground:
          hosts:
            - '{{ include "bud.ingress.hosts.budplayground" . }}'
          allowedReturnUrlOrigins:
            - '{{ include "bud.ingress.url.budplayground" . }}'
storage:
  budmodelRegistry:
    className: standard
    size: 300Gi
