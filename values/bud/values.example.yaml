# Illustrative public overlay generated by budctl for bud.example.com.
# The paired secrets.example.yaml is intentionally absent; budctl creates it
# with environment-specific credentials and encrypts it using SOPS.
externalServices:
  oidc:
    url: https://auth.bud.example.com/realms/bud-keycloak
  s3:
    endpoint: s3.bud.example.com
    secure: true
global:
  ingress:
    hosts:
      root: bud.example.com
ingress:
  className: traefik
  https: internal
  isTraefik: true
microservices:
  askbud:
    enabled: true
  budadmin:
    enabled: true
  budapp:
    enabled: true
    redirectFlow:
      clientsByHost:
        budadmin:
          hosts:
            - '{{ include "bud.ingress.hosts.budadmin" . }}'
          allowedReturnUrlOrigins:
            - '{{ include "bud.ingress.url.budadmin" . }}'
        budcustomer:
          hosts:
            - '{{ include "bud.ingress.hosts.budcustomer" . }}'
          allowedReturnUrlOrigins:
            - '{{ include "bud.ingress.url.budcustomer" . }}'
        budplayground:
          hosts:
            - '{{ include "bud.ingress.hosts.budplayground" . }}'
          allowedReturnUrlOrigins:
            - '{{ include "bud.ingress.url.budplayground" . }}'
  budcache:
    enabled: true
  budcluster:
    enabled: true
  budcodeinterpreter:
    enabled: true
  budcustomer:
    enabled: true
  buddoc:
    enabled: true
  budeval:
    enabled: true
  budevent:
    enabled: true
  budgateway:
    enabled: true
  budmetrics:
    enabled: true
  budmodel:
    enabled: true
  budnotify:
    enabled: true
  budpipeline:
    enabled: true
  budplayground:
    enabled: true
  budprompt:
    enabled: true
  budsentinel:
    enabled: true
  budsim:
    enabled: true
  mcpgateway:
    enabled: true
  semanticRouter:
    enabled: true
storage:
  budmodelRegistry:
    className: standard
    size: 300Gi
