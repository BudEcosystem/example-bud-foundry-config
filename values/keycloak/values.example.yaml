# Illustrative public Keycloak overlay generated by budctl.
ingress:
  className: nginx
  enabled: true
  host: auth.bud.example.com
  https: true
  isTraefik: false
realms:
  keycloak-bud-keycloak-realm:
    clients:
      budadmin-web:
        attributes:
          post.logout.redirect.uris: https://admin.bud.example.com
        redirectUris:
          - https://app.bud.example.com/auth/redirect/callback
        webOrigins:
          - "+"
      budcustomer-web:
        attributes:
          post.logout.redirect.uris: https://admin.bud.example.com##https://customer.bud.example.com##https://playground.bud.example.com
        redirectUris:
          - https://app.bud.example.com/auth/redirect/callback
          - https://customer.bud.example.com/*
        webOrigins:
          - "+"
      budplayground-web:
        attributes:
          post.logout.redirect.uris: https://playground.bud.example.com
        redirectUris:
          - https://app.bud.example.com/auth/redirect/callback
        webOrigins:
          - "+"
      mcp-gateway:
        attributes:
          post.logout.redirect.uris: https://admin.bud.example.com##https://customer.bud.example.com##https://playground.bud.example.com
        redirectUris:
          - https://app.bud.example.com/auth/redirect/callback
        webOrigins:
          - "+"
