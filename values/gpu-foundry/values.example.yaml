# Illustrative public GPU Foundry overlay generated by budctl for bud.example.com.
# The paired secrets.example.yaml is intentionally absent; budctl creates it with the keys
# GPU Foundry's chart requires and encrypts it using SOPS:
#
#   secrets:
#     tokenPepper, sessionKey               generated
#     oidcClientSecret                      = keycloak's gpu-foundry-console secret
#     ssh: { hostKey }                      generated (ed25519, OpenSSH PEM)
#     postgres: { identity, platform, revenue, openmeter, lago }
#                                           = values/postgres's foundry-* passwords
#     clickhouse: { logsSchema, logsCollector, logsReader, logsRecorder,
#                   revenueSchema, revenueWriter, revenueReader }
#                                           = values/clickhouse's foundry_* passwords
#     kafka: { tailPassword, meteringPassword, clusterCaCert, clusterCaKey }
#                                           generated; the CA is valid for ten years
#     lago: { secretKeyBase, rsaPrivateKey, encryptionPrimaryKey, encryptionDeterministicKey,
#             encryptionKeyDerivationSalt, orgApiKey, orgUserPassword }
#                                           generated ONCE; new keys make Lago's data unreadable
#     registry: { dockerConfigJson }        the registry.bud.studio pull credential
#
# GPU Foundry's hack/secrets-init.sh produces the same keys.
api:
  publicOrigin: https://gpu-foundry.bud.example.com
  terminalOrigin: https://gpu-foundry.bud.example.com/terminal
  oidc:
    issuer: https://auth.bud.example.com/realms/bud-keycloak
  # The installation's isolation posture, inherited by every organisation when it is created
  # and never changed afterwards. internal-a: one enterprise whose tenants trust each other.
  # csp-b (the chart's default): tenants that do not trust each other.
  tenancyProfile: internal-a
  # This cluster as GPU Foundry's one cell. It must match controller.cells.
  # telemetryUrl (DCGM exporter) and metricsUrl (Prometheus) are optional; add them where the
  # cluster runs those.
  cells:
    - id: example
      region: example
      synthetic: false
      selfHosted: true
      acceptanceSource: none
  ingress:
    className: traefik
    host: gpu-foundry.bud.example.com
    annotations:
      kubernetes.io/tls-acme: "true"

controller:
  # The tenant NetworkPolicy's egress exceptions, read off the cluster: its service range, its
  # pod range, and every node's own address (`kubectl get nodes -o wide`). Without the node
  # addresses a tenant pod can reach the api-server, kubelets and host-network listeners.
  # A node added to the cluster must be added here.
  network:
    serviceCIDR: 10.43.0.0/16
    platformCIDRs: 10.42.0.0/16,192.0.2.10/32
  cells:
    - id: example
      region: example
      selfHosted: true
      acceptanceSource: none
