# Illustrative public GPU Foundry overlay generated by budctl for bud.example.com.
# The paired secrets.example.yaml is intentionally absent; budctl creates it with the keys
# GPU Foundry's chart requires and encrypts it using SOPS:
#
#   secrets:
#     tokenPepper, sessionKey               generated
#     oidcClientSecret                      = keycloak's gpu-foundry-console secret
#     ssh: { hostKey, caKey, caPub }        generated, all three: hostKey is sshpiperd's host key
#                                           (ed25519, OpenSSH PEM); caKey/caPub are the SSH user CA
#                                           pair (ed25519; caPub is the one-line public key).
#                                           Without the CA pair the access gateway serves no SSH
#                                           and its sshpiperd sidecar crash-loops.
#     postgres: { identity, platform, revenue, openmeter, lago }
#                                           = values/postgres's foundry-* passwords
#     clickhouse: { logsSchema, logsCollector, logsReader, logsRecorder,
#                   revenueSchema, revenueWriter, revenueReader }
#                                           = values/clickhouse's foundry_* passwords
#     kafka: { tailPassword, meteringPassword, clusterCaCert, clusterCaKey }
#                                           generated; the CA is valid for ten years
#     lago: { secretKeyBase, rsaPrivateKey, encryptionPrimaryKey, encryptionDeterministicKey,
#             encryptionKeyDerivationSalt, orgApiKey, orgUserPassword }
#                                           generated ONCE; new keys make Lago's data unreadable
#     registry: { dockerConfigJson }        the registry.bud.studio pull credential
#
# GPU Foundry's hack/secrets-init.sh produces the same keys (the CA pair with SSH_SIGNER=1).
api:
  publicOrigin: https://gpu-foundry.bud.example.com
  terminalOrigin: https://gpu-foundry.bud.example.com/terminal
  oidc:
    issuer: https://auth.bud.example.com/realms/bud-keycloak
  # The installation's isolation posture, inherited by every organisation when it is created
  # and never changed afterwards. internal-a: one enterprise whose tenants trust each other.
  # csp-b (the chart's default): tenants that do not trust each other.
  tenancyProfile: internal-a
  # The currency every price, budget and invoice is recorded in: an ISO 4217 code with two
  # decimal places (USD, EUR, GBP, INR, ...). Unset, it is GBP. Choose it before the first price
  # is approved: amounts are never converted, and foundry-api refuses to start when an approved
  # price is in another currency.
  rateCard:
    currency: USD
  # The console's own name and logo instead of Bud's. Unset, the console is Bud's. Each file
  # comes from a URL (fetched by foundry-api, not the browser, and again every 10m, so a logo
  # replaced at its URL updates) or as base64 (`base64 -i logo.svg | tr -d '\n'`, for an
  # air-gapped cluster). One logo serves both themes.
  # branding:
  #   productName: Example GPU Cloud
  #   logo:
  #     onDarkUrl: https://example.com/brand/logo-light-ink.svg
  #     # or, as base64:
  #     # format: svg          # png | svg | webp | jpeg
  #     # onDark: <base64>
  #   favicon:
  #     url: https://example.com/brand/icon.svg
  # This cluster as GPU Foundry's one cell. It must match controller.cells. Name it for the
  # cluster (letters, digits and hyphens): it's hard to rename once projects exist.
  # telemetryUrl (DCGM exporter) and metricsUrl (Prometheus) are optional; add them where the
  # cluster runs those.
  # On bare-metal OpenShift add `hostSource: none` here and in controller.cells: its machine
  # API serves BareMetalHost, and without it foundry-api and foundry-controller refuse to start.
  cells:
    - id: example
      region: example
      synthetic: false
      selfHosted: true
      acceptanceSource: none
  # On OpenShift, set className: openshift-default and add the annotation
  # route.openshift.io/termination: edge. With className traefik the chart also renders a
  # traefik Middleware, and the sync fails where traefik's CRDs aren't installed.
  ingress:
    className: traefik
    host: gpu-foundry.bud.example.com
    annotations:
      kubernetes.io/tls-acme: "true"

controller:
  # The tenant NetworkPolicy's egress exceptions, read off the cluster: its service range, its
  # pod range, and every node's own address (`kubectl get nodes -o wide`). Without the node
  # addresses a tenant pod can reach the api-server, kubelets and host-network listeners.
  # A node added to the cluster must be added here.
  network:
    serviceCIDR: 10.43.0.0/16
    platformCIDRs: 10.42.0.0/16,192.0.2.10/32
  cells:
    - id: example
      region: example
      selfHosted: true
      acceptanceSource: none

# On OpenShift, uncomment. The chart can detect OpenShift on its own, but on an estate where Argo
# didn't pass the cluster's API versions every pod was refused by restricted-v2.
# platform:
#   openshift: true

# The SSH front door. The default is a LoadBalancer on 2222 at the console's host. On OpenShift
# without MetalLB, use a NodePort and name the host tenants reach it on (GPU-FOUNDRY.md).
# accessGateway:
#   ssh:
#     service:
#       type: NodePort
#       nodePort: 32222
#     publicHost: ssh.gpu-foundry.bud.example.com
